    <script>
        async function getStats() {
            try {
                // Use window.supabaseClient instead of supabase
                const { count, error } = await window.supabaseClient
                    .from('trips')
                    .select('*', { count: 'exact', head: true });

                if (error) throw error;

                // Update the element with the count
                const statElement = document.getElementById('stat-count');
                if (statElement) {
                    statElement.textContent = count !== null ? count : 0;
                }
            } catch (err) {
                console.error("Error fetching stats:", err.message);
                document.getElementById('stat-count').textContent = "0";
            }
        }

        // Run when the page is fully loaded
        document.addEventListener('DOMContentLoaded', () => {
            // Wait a small moment to ensure supabase-config.js has initialized the client
            setTimeout(getStats, 500); 
        });

document.addEventListener('DOMContentLoaded', async () => {
    // 1. Initialize the Map centered on Algeria
    const map = L.map('map').setView([36.7538, 3.0588], 6);

    // 2. Add the Tile Layer (The actual map graphics)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 3. Locate the User via GPS
    map.locate({setView: true, maxZoom: 10});
    map.on('locationfound', (e) => {
        L.circle(e.latlng, { radius: e.accuracy / 2, color: '#1cc88a' }).addTo(map);
        L.marker(e.latlng).addTo(map).bindPopup("You are here").openPopup();
    });

    // 4. Function to Geocode and Add Marker
    async function addRideToMap(originCity, driverName, price) {
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(originCity + ", Algeria")}`;
        
        try {
            const response = await fetch(url, {
                headers: { 'User-Agent': 'GoShareDZ_App' } 
            });
            const data = await response.json();

            if (data && data.length > 0) {
                const lat = data[0].lat;
                const lon = data[0].lon;

                const marker = L.marker([lat, lon]).addTo(map);
                marker.bindPopup(`
                    <div style="text-align:center; font-family: sans-serif;">
                        <h6 style="margin:0; color:#1cc88a;">${originCity}</h6>
                        <p style="margin:5px 0; font-size:12px;">Driver: ${driverName}</p>
                        <span class="badge badge-success">${price} DZD</span>
                    </div>
                `);
                console.log("Marker added for:", originCity);
            }
        } catch (err) {
            console.error("Map Error for " + originCity + ":", err);
        }
    }

    // 5. Main Loader: Get data from Supabase and Map it
    async function loadAllRides() {
        const { data: rides, error } = await window.supabaseClient
            .from('trips')
            .select('*');

        if (error) {
            console.error("Supabase error:", error.message);
            return;
        }

        if (rides) {
            // Sequential loading to respect Nominatim's 1-request-per-second rule
            for (const ride of rides) {
                // Adjust 'origin', 'driver_name', and 'price' to match your actual Supabase column names
                await addRideToMap(ride.origin, ride.driver_name || "Member", ride.price || "N/A");
                
                // Wait 1.1 seconds before the next city
                await new Promise(resolve => setTimeout(resolve, 1100));
            }
        }
    }

    // Run the loader
    loadAllRides();
});
    </script>
