                                        <hr>
                                        <!--div class="form-group row">
                                            <div class="col-sm-6 mb-3 mb-sm-0">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script>
        const wilayas = [
            "01: Adrar", "02: Chlef", "03: Laghouat", "04: Oum El Bouaghi", 
            "05: Batna", "06: Béjaïa", "07: Biskra", "08: Béchar", 
            "09: Blida", "10: Bouira", "11: Tamanrasset", "12: Tébessa", 
            "13: Tlemcen", "14: Tiaret", "15: Tizi Ouzou", "16: Alger", 
            "17: Djelfa", "18: Jijel", "19: Sétif", "20: Saïda", 
            "21: Skikda", "22: Sidi Bel Abbès", "23: Annaba", "24: Guelma", 
            "25: Constantine", "26: Médéa", "27: Mostaganem", "28: M'Sila", 
            "29: Mascara", "30: Ouargla", "31: Oran", "32: El Bayadh", 
            "33: Illizi", "34: Bordj Bou Arreridj", "35: Boumerdès", "36: El Tarf", 
            "37: Tindouf", "38: Tissemsilt", "39: El Oued", "40: Khenchela", 
            "41: Souk Ahras", "42: Tipaza", "43: Mila", "44: Aïn Defla", 
            "45: Naâma", "46: Aïn Témouchent", "47: Ghardaïa", "48: Relizane", 
            "49: Timimoun", "50: Bordj Badji Mokhtar", "51: Ouled Djellal", "52: Beni Abbès", 
            "53: In Salah", "54: In Guezzam", "55: Touggourt", "56: Djanet", 
            "57: El M'Ghair", "58: El Meniaa"
        ];

        function populateWilayas() {
            const originSelect = document.getElementById('origin_wilaya');
            const destSelect = document.getElementById('destination_wilaya');

            wilayas.forEach(w => {
                // Create option for Origin
                let opt1 = document.createElement("option");
                opt1.innerHTML = w;
                opt1.value = w;
                originSelect.appendChild(opt1);

                // Create option for Destination
                let opt2 = document.createElement("option");
                opt2.innerHTML = w;
                opt2.value = w;
                destSelect.appendChild(opt2);
            });
        }

        // Run this when the page loads
        document.addEventListener('DOMContentLoaded', populateWilayas);
    </script>
    <script>
        document.getElementById('tripForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const { data: { user } } = await window.supabaseClient.auth.getUser();

            const tripData = {
                // Get values from the dropdowns
                origin: document.getElementById('origin_wilaya').value,
                destination: document.getElementById('destination_wilaya').value,
                
                departure_date: document.getElementById('date').value,
                departure_time: document.getElementById('time').value,
                seats: parseInt(document.getElementById('seats').value),
                price: parseFloat(document.getElementById('price').value),
                driver_name: document.getElementById('driver_name').value,
                phone_number: document.getElementById('phone_number').value,
                user_id: user.id
            };

            const { error } = await window.supabaseClient.from('trips').insert([tripData]);

            if (error) {
                alert("Error: " + error.message);
            } else {
                alert("Trip Published!");
                window.location.href = 'find.html';
            }
        });
    </script>
