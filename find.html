    <script>
        async function cleanOldTrips() {
            const today = new Date().toISOString().split('T')[0];
            
            // Deletes any trip where the departure_date is before today
            const { error } = await window.supabaseClient
                .from('trips')
                .delete()
                .lt('departure_date', today); 

            if (error) console.error("Cleanup error:", error);
        }

        // Call it before fetching
        cleanOldTrips().then(fetchRides);

// Inside your find.html <script>
async function fetchRides() {
    const { data, error } = await window.supabaseClient
        .from('trips')
        .select('*')
        .order('is_featured', { ascending: false }) // Show featured trips first!
        .order('departure_date', { ascending: true });

    const body = document.getElementById('rides-table-body');
    
    // Replace the old <tr> based .map() with this <div> based one
    body.innerHTML = data.map(t => {
        const featuredClass = t.is_featured ? 'featured-card' : '';
        const starIcon = t.is_featured ? '<i class="fas fa-star text-warning"></i>' : '';
        
        return `
        <div class="card shadow-sm mb-3 ${featuredClass}" style="border-radius: 15px; border: none;">
            <div class="card-body p-3">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="badge badge-success" style="font-size: 0.9rem;">
                        ${t.price} DZD
                    </span>
                    <span class="text-muted small"><i class="far fa-clock"></i> ${t.departure_date}</span>
                </div>
                
                <h5 class="card-title mb-1" style="font-weight: 700; color: #333;">
                    ${starIcon} ${t.origin} <i class="fas fa-arrow-right mx-2 text-success" style="font-size: 0.8rem;"></i> ${t.destination}
                </h5>
                
                <p class="card-text mb-3 text-secondary small">
                    <i class="fas fa-user-circle mr-1"></i> ${t.driver_name} • 
                    <i class="fas fa-chair mr-1"></i> ${t.seats} Seats
                </p>

                <div class="d-flex gap-2">
                    <a href="tel:${t.phone_number}" class="btn btn-outline-success btn-block mr-2" style="border-radius: 10px;">
                        <i class="fas fa-phone"></i> Call
                    </a>
                    <a href="https://wa.me/213${t.phone_number.substring(1)}" class="btn btn-success btn-block" style="background-color: #25D366; border: none; border-radius: 10px;">
                        <i class="fab fa-whatsapp"></i> WhatsApp
                    </a>
                </div>
            </div>
        </div>
        `;
    }).join('');
}
        
        // Run after page loads
        document.addEventListener('DOMContentLoaded', fetchRides);

        // Filter Script
        document.getElementById('citySearch').addEventListener('keyup', function() {
            const filter = this.value.toLowerCase();
            const rows = document.querySelectorAll('#rides-table-body .card');

            rows.forEach(row => {
                // This looks at the "Route" column (now in the card title)
                const routeText = row.querySelector('.card-title').textContent.toLowerCase();
                
                // If the search term is found in the route, show the row
                if (routeText.includes(filter)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        });
    </script>
