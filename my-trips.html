<body id="page-top">
    <div id="wrapper">
        <ul class="navbar-nav bg-gradient-success sidebar sidebar-dark accordion" id="accordionSidebar">
            <a class="sidebar-brand d-flex align-items-center justify-content-center" href="dash.html">
                <div class="sidebar-brand-icon rotate-n-15"><i class="fas fa-car"></i></div>
                <div class="sidebar-brand-text mx-3">GoShare <sup>DZ</sup></div>
            </a>
            <hr class="sidebar-divider my-0">
            <li class="nav-item"><a class="nav-link" href="dash.html"><i class="fas fa-fw fa-tachometer-alt"></i><span>Dashboard</span></a></li>
            <li class="nav-item"><a class="nav-link" href="find.html"><i class="fas fa-fw fa-search"></i><span>Find a Ride</span></a></li>
            <li class="nav-item"><a class="nav-link" href="offer.html"><i class="fas fa-fw fa-plus"></i><span>Offer a Ride</span></a></li>
            <li class="nav-item active"><a class="nav-link" href="my-trips.html"><i class="fas fa-fw fa-list"></i><span>My Trips</span></a></li>
        </ul>

        <div id="content-wrapper" class="d-flex flex-column">
            <div id="content">
                <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow-sm custom-header">
                    <div class="container-fluid d-flex justify-content-between align-items-center">
                        <a class="navbar-brand d-flex align-items-center" href="dash.html">
                            <div class="brand-icon rotate-n-15">
                                <i class="fas fa-car-side text-success"></i>
                            </div>
                            <div class="brand-text mx-2 font-weight-bold text-dark">GoShare <span class="text-success">DZ</span></div>
                        </a>

                        <ul class="navbar-nav ml-auto">
                            <li class="nav-item dropdown no-arrow">
                                <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                    <img class="img-profile rounded-circle" src="img/undraw_profile.svg" style="width: 32px; height: 32px; border: 1px solid #eee;">
                                </a>
                                
                                <div class="dropdown-menu dropdown-menu-right shadow animated--grow-in" aria-labelledby="userDropdown">
                                    <div class="dropdown-header">
                                        <i class="fas fa-user mr-2"></i>
                                        <span class="font-weight-bold" id="userDropdownSpan">Guest</span>
                                    </div>
                                    <div class="dropdown-divider"></div>
                                    <a class="dropdown-item" href="javascript:void(0);" onclick="logout()" id="logoutBtn">
                                        <i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-danger"></i>
                                        <span class="text-danger">Logout</span>
                                    </a>
                                </div>
                            </li>
                        </ul>
                    </div>
                </nav>

                <div class="container-fluid">
                    <h1 class="h3 mb-4 text-gray-800">Manage My Trips</h1>
                    <div class="card shadow mb-4">
                        <div class="card-body">
                            <div class="table-responsive"> <table class="table table-bordered" width="100%" cellspacing="0">
                                    <thead>
                                        <tr>
                                            <th>Route</th>
                                            <th>Date</th>
                                            <th>Seats</th>
                                            <th>Price</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody id="my-rides-body">
                                        <tr><td colspan="5" class="text-center">Loading your trips...</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <footer class="sticky-footer bg-white">
                <div class="container my-auto">
                    <div class="copyright text-center my-auto">
                        <span>Copyright &copy; GoShare DZ 2026</span>
                    </div>
                </div>
            </footer>
        </div>
    </div>
    <nav class="mobile-nav d-md-none">
        <a href="dash.html" class="nav-link">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="find.html" class="nav-link">
            <i class="fas fa-search"></i>
            <span>Find</span>
        </a>
        <a href="offer.html" class="nav-link">
            <i class="fas fa-plus-circle" style="font-size: 1.5rem; color: #1cc88a;"></i>
            <span>Post</span>
        </a>
        <a href="my-trips.html" class="nav-link">
            <i class="fas fa-car"></i>
            <span>My Trips</span>
        </a>
    </nav>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script>
        async function fetchMyRides() {
            const { data: { user } } = await window.supabaseClient.auth.getUser();
            
            const { data, error } = await window.supabaseClient
                .from('trips')
                .select('*')
                .eq('user_id', user.id); // Only fetch YOUR trips

            const body = document.getElementById('my-rides-body');
            if (error || data.length === 0) {
                body.innerHTML = '<tr><td colspan="5">No trips found.</td></tr>';
                return;
            }

            body.innerHTML = data.map(t => `
                <tr>
                    <td>${t.origin} ➔ ${t.destination}</td>
                    <td>${t.departure_date}</td>
                    <td>${t.seats}</td>
                    <td>${t.price} DZD</td>
                    <td><button onclick="deleteTrip('${t.id}')" class="btn btn-danger btn-sm">Delete</button></td>
                </tr>
            `).join('');
        }

        async function deleteTrip(id) {
            if(confirm("Delete this trip?")) {
                await window.supabaseClient.from('trips').delete().eq('id', id);
                fetchMyRides(); // Refresh
            }
        }

        document.addEventListener('DOMContentLoaded', fetchMyRides);
    </script>
</body>
</html>
